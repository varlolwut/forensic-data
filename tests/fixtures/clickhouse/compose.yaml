name: forensic-data-phase05-clickhouse

x-clickhouse-image: &clickhouse-image
  image: clickhouse:26.8.6.5@sha256:d4cb553ca09d0d403aa25995cf14f079b3aea06406ea1463665fc1f9c185375c
  platform: linux/amd64

services:
  tls-init:
    <<: *clickhouse-image
    entrypoint:
      - /bin/bash
      - /fixture-tls/generate.sh
      - /generated
    volumes:
      - ./tls:/fixture-tls:ro
      - ../../../.local/p05-05-clickhouse-tls:/generated
    restart: "no"

  clickhouse:
    <<: *clickhouse-image
    hostname: forensic-data-phase05-clickhouse
    depends_on:
      tls-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: dfe_fixture
      CLICKHOUSE_USER: dfe_fixture_admin
      CLICKHOUSE_PASSWORD: ${DFE_CLICKHOUSE_ADMIN_PASSWORD:?set DFE_CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      DFE_CLICKHOUSE_READER_PASSWORD: ${DFE_CLICKHOUSE_READER_PASSWORD:?set DFE_CLICKHOUSE_READER_PASSWORD}
      DFE_CLICKHOUSE_WRITER_PASSWORD: ${DFE_CLICKHOUSE_WRITER_PASSWORD:?set DFE_CLICKHOUSE_WRITER_PASSWORD}
    ports:
      - 127.0.0.1:${DFE_CLICKHOUSE_HTTP_PORT:?set DFE_CLICKHOUSE_HTTP_PORT}:8123
      - 127.0.0.1:${DFE_CLICKHOUSE_HTTPS_PORT:?set DFE_CLICKHOUSE_HTTPS_PORT}:8443
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/https.xml:/etc/clickhouse-server/config.d/https.xml:ro
      - ./init:/docker-entrypoint-initdb.d:ro
      - ../../../.local/p05-05-clickhouse-tls:/etc/clickhouse-server/tls:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(wget
          --quiet
          --output-document=-
          --tries=1
          --timeout=2
          --ca-certificate=/etc/clickhouse-server/tls/fixture-ca.pem
          https://localhost:8443/ping)" = "Ok."
          && test "$$(clickhouse-client
          --user dfe_fixture_reader
          --password "$${DFE_CLICKHOUSE_READER_PASSWORD}"
          --database dfe_fixture
          --query="SELECT
          version() = '26.8.6.5'
          AND getSetting('readonly') = 1
          AND getSetting('cancel_http_readonly_queries_on_client_close') = 1
          AND getSetting('max_memory_usage') = 268435456
          AND getSetting('max_threads') = 2
          AND getSetting('max_block_size') = 65536
          AND getSetting('http_wait_end_of_query') = 1
          AND getSetting('max_execution_time') = 30
          AND getSetting('max_result_rows') = 100000
          AND getSetting('max_result_bytes') = 67108864
          AND getSetting('max_rows_to_group_by') = 1
          AND getSetting('group_by_overflow_mode') = 'any'
          AND getSetting('result_overflow_mode') = 'throw'
          AND getSetting('final') = 0
          AND getSetting('apply_mutations_on_fly') = 0
          AND getSetting('apply_patch_parts') = 0
          AND getSetting('do_not_merge_across_partitions_select_final') = 0
          AND (SELECT count() FROM fidelity_probe) = 3
          AND (SELECT count() FROM canonical_common_types) = 2
          AND (SELECT count() FROM canonical_empty_common_types) = 0
          AND (SELECT count() FROM canonical_lossy_common_types) = 2
          AND (SELECT count() FROM canonical_nullable_strings) = 2
          AND (SELECT count() FROM canonical_key_groups) = 5
          AND (SELECT count() FROM canonical_null_key) = 1
          AND (SELECT count() FROM canonical_group_overflow) = 5
          AND (SELECT count() FROM immutable_version_readiness) = 2
          AND (SELECT count() FROM immutable_orders_staging) = 3
          AND (SELECT count() FROM immutable_orders_v001) = 2
          AND (SELECT count() FROM immutable_orders_v002) = 3
          AND (SELECT count() FROM logical_orders_v001) = 5
          AND (SELECT count() FROM logical_orders_v001 FINAL) = 3
          AND (SELECT count() FROM system.row_policies WHERE database = 'system') = 0
          AND (SELECT position(engine_full, 'table_readonly = 1') > 0 FROM system.tables WHERE database = 'dfe_fixture' AND name = 'immutable_orders_v001')
          AND (SELECT position(engine_full, 'table_readonly = 1') > 0 FROM system.tables WHERE database = 'dfe_fixture' AND name = 'immutable_orders_v002')")" = "1"
          && test "$$(clickhouse-client
          --user dfe_fixture_reader
          --password "$${DFE_CLICKHOUSE_READER_PASSWORD}"
          --database dfe_fixture
          --query="SELECT
          uuid = toUUID('33333333-3333-4333-8333-333333333333')
          AND engine = 'ReplacingMergeTree'
          AND sorting_key = 'order_id'
          AND partition_key = ''
          AND position(engine_full, 'ReplacingMergeTree(row_version)') > 0
          AND position(engine_full, 'table_readonly = 1') > 0
          FROM system.tables
          WHERE database = 'dfe_fixture' AND name = 'logical_orders_v001'")" = "1"
          && test "$$(clickhouse-client
          --user dfe_fixture_writer
          --password "$${DFE_CLICKHOUSE_WRITER_PASSWORD}"
          --database dfe_fixture
          --query="SELECT count() FROM immutable_orders_staging")" = "3"
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: "no"

volumes:
  clickhouse-data:
