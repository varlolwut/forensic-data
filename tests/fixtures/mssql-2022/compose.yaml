name: forensic-data-phase03-mssql2022

x-mssql-image: &mssql-image
  image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
  platform: linux/amd64

x-mssql-client: &mssql-client
  <<: *mssql-image
  profiles: [setup]
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp
  depends_on:
    sqlserver:
      condition: service_healthy
  restart: "no"

services:
  sqlserver:
    <<: *mssql-image
    hostname: forensic-data-phase03-mssql2022
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DFE_MSSQL_SA_PASSWORD:?set DFE_MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - 127.0.0.1:${DFE_MSSQL_PORT:?set DFE_MSSQL_PORT}:1433
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
          /opt/mssql-tools18/bin/sqlcmd
          -S tcp:localhost,1433 -U sa -d master
          -Nm -C -l 5 -t 5 -b
          -Q "SET NOCOUNT ON; SELECT 1" >/dev/null
      interval: 2s
      timeout: 8s
      retries: 60
      start_period: 20s
    mem_limit: 3g
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: "no"

  setup-admin:
    <<: *mssql-client
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SQLCMDPASSWORD: ${DFE_MSSQL_SA_PASSWORD:?set DFE_MSSQL_SA_PASSWORD}
      DFE_MSSQL_READER_PASSWORD: ${DFE_MSSQL_READER_PASSWORD:?set DFE_MSSQL_READER_PASSWORD}
      DFE_MSSQL_SETUP_WRITER_PASSWORD: ${DFE_MSSQL_SETUP_WRITER_PASSWORD:?set DFE_MSSQL_SETUP_WRITER_PASSWORD}
    volumes:
      - ./setup:/opt/forensic-data/mssql-2022:ro
    entrypoint: ["/bin/bash", "/opt/forensic-data/mssql-2022/setup-admin.sh"]

  setup-writer:
    <<: *mssql-client
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SQLCMDPASSWORD: ${DFE_MSSQL_SETUP_WRITER_PASSWORD:?set DFE_MSSQL_SETUP_WRITER_PASSWORD}
    volumes:
      - ./setup:/opt/forensic-data/mssql-2022:ro
    entrypoint: ["/bin/bash", "/opt/forensic-data/mssql-2022/setup-writer.sh"]

  verify:
    <<: *mssql-client
    profiles: [verify]
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SQLCMDPASSWORD: ${DFE_MSSQL_READER_PASSWORD:?set DFE_MSSQL_READER_PASSWORD}
    volumes:
      - ./verify:/opt/forensic-data/mssql-2022:ro
    entrypoint: ["/bin/bash", "/opt/forensic-data/mssql-2022/verify.sh"]

volumes:
  mssql-data:
