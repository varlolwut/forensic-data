name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, PostgreSQL conformance, and SQL Server fixture
    runs-on: ubuntu-24.04
    env:
      DFE_PG_ADMIN_PASSWORD: phase01-admin
      DFE_PG_READER_PASSWORD: phase01-reader
      DFE_PG_WRITER_PASSWORD: phase01-writer
      DFE_PG_METADATA_MIGRATOR_PASSWORD: phase02-metadata-migrator
      DFE_PG_METADATA_WRITER_PASSWORD: phase02-metadata-writer
      DFE_PG_METADATA_READER_PASSWORD: phase02-metadata-reader
      DFE_PG_PORT: "55432"
      DFE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:phase01-admin@127.0.0.1:55432/postgres
      DFE_TEST_POSTGRES_READER_DSN: postgresql://dfe_fixture_reader:phase01-reader@127.0.0.1:55432/dfe_fixture
      DFE_TEST_POSTGRES_WRITER_DSN: postgresql://dfe_fixture_writer:phase01-writer@127.0.0.1:55432/dfe_fixture
      DFE_TEST_POSTGRES_METADATA_MIGRATOR_DSN: postgresql://dfe_metadata_migrator_login:phase02-metadata-migrator@127.0.0.1:55432/dfe_fixture
      DFE_TEST_POSTGRES_METADATA_WRITER_DSN: postgresql://dfe_metadata_writer_login:phase02-metadata-writer@127.0.0.1:55432/dfe_fixture
      DFE_TEST_POSTGRES_METADATA_READER_DSN: postgresql://dfe_metadata_reader_login:phase02-metadata-reader@127.0.0.1:55432/dfe_fixture
      DFE_LEGACY_SOURCE_ADMIN_PASSWORD: phase02-legacy-source-admin
      DFE_LEGACY_SOURCE_READER_PASSWORD: phase02-legacy-source-reader
      DFE_LEGACY_TARGET_ADMIN_PASSWORD: phase02-legacy-target-admin
      DFE_LEGACY_TARGET_READER_PASSWORD: phase02-legacy-target-reader
      DFE_LEGACY_SOURCE_PORT: "55496"
      DFE_LEGACY_TARGET_PORT: "55417"
      DFE_TEST_POSTGRES_LEGACY_SOURCE_DSN: postgresql://dfe_legacy_reader:phase02-legacy-source-reader@127.0.0.1:55496/dfe_legacy?sslmode=disable&connect_timeout=5
      DFE_TEST_POSTGRES_LEGACY_TARGET_DSN: postgresql://dfe_legacy_reader:phase02-legacy-target-reader@127.0.0.1:55417/dfe_legacy?sslmode=disable&connect_timeout=5
      DFE_MSSQL_SA_PASSWORD: Phase03-Mssql-SA-2022!
      DFE_MSSQL_READER_PASSWORD: Phase03-Mssql-Reader-2022!
      DFE_MSSQL_SETUP_WRITER_PASSWORD: Phase03-Mssql-Writer-2022!
      DFE_MSSQL_PORT: "51433"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          version: "0.12.18"
      - name: Install Microsoft ODBC Driver 18.7.1.1
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/msodbcsql18_18.7.1.1-1_amd64.deb \
            https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/m/msodbcsql18/msodbcsql18_18.7.1.1-1_amd64.deb
          echo "f506cb3de8b34cd94e9014d247b39e9dfd7effad79edad3ab67096dc3c1b6b0e  /tmp/msodbcsql18_18.7.1.1-1_amd64.deb" \
            | sha256sum --check --strict
          sudo apt-get update
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends \
            /tmp/msodbcsql18_18.7.1.1-1_amd64.deb
          test "$(dpkg-query --show --showformat='${Version}' msodbcsql18)" = "18.7.1.1-1"
          rm /tmp/msodbcsql18_18.7.1.1-1_amd64.deb
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check types
        run: uv run pyright
      - name: Start PostgreSQL 17.11 fixture
        run: docker compose --file tests/fixtures/postgres/compose.yaml up --detach --wait
      - name: Start PostgreSQL 9.6.24 to 17.11 fixture
        run: docker compose --file tests/fixtures/postgres-legacy/compose.yaml up --detach --wait
      - name: Start SQL Server 2022 CU27 fixture
        run: docker compose --file tests/fixtures/mssql-2022/compose.yaml up --detach --wait sqlserver
      - name: Configure and verify SQL Server 2022 CU27 fixture
        run: |
          docker compose --file tests/fixtures/mssql-2022/compose.yaml run --rm setup-admin
          docker compose --file tests/fixtures/mssql-2022/compose.yaml run --rm setup-writer
          docker compose --file tests/fixtures/mssql-2022/compose.yaml run --rm verify
      - name: Run tests
        run: uv run pytest -m "not mssql_legacy"
      - name: Stop database fixtures
        if: always()
        run: |
          docker compose --file tests/fixtures/mssql-2022/compose.yaml down --volumes --remove-orphans
          docker compose --file tests/fixtures/postgres-legacy/compose.yaml down --volumes
          docker compose --file tests/fixtures/postgres/compose.yaml down --volumes

  sqlserver-2016:
    name: SQL Server 2016 to PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DFE_MSSQL_2016_HOST: "127.0.0.1"
      DFE_MSSQL_2016_PORT: "51416"
      DFE_PG_ADMIN_PASSWORD: phase01-admin
      DFE_PG_READER_PASSWORD: phase01-reader
      DFE_PG_WRITER_PASSWORD: phase01-writer
      DFE_PG_METADATA_MIGRATOR_PASSWORD: phase02-metadata-migrator
      DFE_PG_METADATA_WRITER_PASSWORD: phase02-metadata-writer
      DFE_PG_METADATA_READER_PASSWORD: phase02-metadata-reader
      DFE_PG_PORT: "55432"
      DFE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:phase01-admin@127.0.0.1:55432/postgres
      DFE_TEST_POSTGRES_READER_DSN: postgresql://dfe_fixture_reader:phase01-reader@127.0.0.1:55432/dfe_fixture
      DFE_TEST_POSTGRES_WRITER_DSN: postgresql://dfe_fixture_writer:phase01-writer@127.0.0.1:55432/dfe_fixture
      DFE_TEST_POSTGRES_METADATA_MIGRATOR_DSN: postgresql://dfe_metadata_migrator_login:phase02-metadata-migrator@127.0.0.1:55432/dfe_fixture
      DFE_TEST_POSTGRES_METADATA_WRITER_DSN: postgresql://dfe_metadata_writer_login:phase02-metadata-writer@127.0.0.1:55432/dfe_fixture
      DFE_TEST_POSTGRES_METADATA_READER_DSN: postgresql://dfe_metadata_reader_login:phase02-metadata-reader@127.0.0.1:55432/dfe_fixture
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          available_bytes=$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1)
          if (( available_bytes < 28 * 1024 * 1024 * 1024 )); then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          fi
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            qemu-system-x86 qemu-utils xorriso curl
          df -h "$RUNNER_TEMP"
          free -h
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          version: "0.12.18"
      - name: Install Microsoft ODBC Driver 18.7.1.1
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/msodbcsql18_18.7.1.1-1_amd64.deb \
            https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/m/msodbcsql18/msodbcsql18_18.7.1.1-1_amd64.deb
          echo "f506cb3de8b34cd94e9014d247b39e9dfd7effad79edad3ab67096dc3c1b6b0e  /tmp/msodbcsql18_18.7.1.1-1_amd64.deb" \
            | sha256sum --check --strict
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends \
            /tmp/msodbcsql18_18.7.1.1-1_amd64.deb
          test "$(dpkg-query --show --showformat='${Version}' msodbcsql18)" = "18.7.1.1-1"
          rm /tmp/msodbcsql18_18.7.1.1-1_amd64.deb
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Generate disposable guest and fixture credentials
        shell: bash
        run: |
          set -euo pipefail
          for variable in DFE_MSSQL_2016_SA_PASSWORD DFE_MSSQL_2016_READER_PASSWORD DFE_MSSQL_2016_SETUP_WRITER_PASSWORD; do
            password="Aa1!$(openssl rand -hex 24)"
            echo "::add-mask::$password"
            echo "$variable=$password" >> "$GITHUB_ENV"
          done
      - name: Provision and verify actual SQL Server 2016 SP3 GDR
        shell: bash
        run: bash tests/fixtures/mssql-2016/ci/start.sh "$RUNNER_TEMP/dfe-sql2016"
      - name: Start PostgreSQL 17.11 fixture
        run: docker compose --file tests/fixtures/postgres/compose.yaml up --detach --wait
      - name: Configure and verify fresh SQL Server 2016 fixture
        run: uv run python tests/fixtures/mssql-2016/setup.py
      - name: Run SQL Server 2016 critical integration tests
        run: uv run pytest -q -m "integration and mssql and mssql_legacy" tests/test_mssql_2016_postgres_comparison_integration.py
      - name: Remove disposable SQL Server guest and media
        if: always()
        shell: bash
        run: bash tests/fixtures/mssql-2016/ci/stop.sh "$RUNNER_TEMP/dfe-sql2016"
      - name: Stop PostgreSQL fixture
        if: always()
        run: docker compose --file tests/fixtures/postgres/compose.yaml down --volumes

  build:
    name: Build package and container
    needs: [quality, sqlserver-2016]
    runs-on: ubuntu-24.04
    env:
      DFE_PG_ADMIN_PASSWORD: phase01-admin
      DFE_PG_READER_PASSWORD: phase01-reader
      DFE_PG_WRITER_PASSWORD: phase01-writer
      DFE_PG_METADATA_MIGRATOR_PASSWORD: phase02-metadata-migrator
      DFE_PG_METADATA_WRITER_PASSWORD: phase02-metadata-writer
      DFE_PG_METADATA_READER_PASSWORD: phase02-metadata-reader
      DFE_PG_PORT: "55432"
      DFE_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:phase01-admin@127.0.0.1:55432/postgres
      DFE_TEST_POSTGRES_METADATA_MIGRATOR_DSN: postgresql://dfe_metadata_migrator_login:phase02-metadata-migrator@127.0.0.1:55432/dfe_fixture?sslmode=disable&connect_timeout=5
      DFE_TEST_POSTGRES_METADATA_WRITER_DSN: postgresql://dfe_metadata_writer_login:phase02-metadata-writer@127.0.0.1:55432/dfe_fixture?sslmode=disable&connect_timeout=5
      DFE_TEST_POSTGRES_METADATA_READER_DSN: postgresql://dfe_metadata_reader_login:phase02-metadata-reader@127.0.0.1:55432/dfe_fixture?sslmode=disable&connect_timeout=5
      DFE_LEGACY_SOURCE_ADMIN_PASSWORD: phase02-legacy-source-admin
      DFE_LEGACY_SOURCE_READER_PASSWORD: phase02-legacy-source-reader
      DFE_LEGACY_TARGET_ADMIN_PASSWORD: phase02-legacy-target-admin
      DFE_LEGACY_TARGET_READER_PASSWORD: phase02-legacy-target-reader
      DFE_LEGACY_SOURCE_PORT: "55496"
      DFE_LEGACY_TARGET_PORT: "55417"
      DFE_TEST_POSTGRES_LEGACY_SOURCE_DSN: postgresql://dfe_legacy_reader:phase02-legacy-source-reader@127.0.0.1:55496/dfe_legacy?sslmode=disable&connect_timeout=5
      DFE_TEST_POSTGRES_LEGACY_TARGET_DSN: postgresql://dfe_legacy_reader:phase02-legacy-target-reader@127.0.0.1:55417/dfe_legacy?sslmode=disable&connect_timeout=5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          version: "0.12.18"
      - name: Install locked build dependencies
        run: uv sync --frozen --only-group build
      - name: Build wheel and source distribution
        run: |
          uv lock --check
          uv build --no-build-isolation --no-create-gitignore --clear
      - name: Smoke-test built wheel
        run: |
          uv venv --python 3.12.14 .artifact-venv
          uv export --frozen --no-dev --no-emit-project --output-file /tmp/forensic-data-runtime.txt
          uv pip install \
            --python .artifact-venv/bin/python \
            --require-hashes \
            --requirements /tmp/forensic-data-runtime.txt
          uv pip install --python .artifact-venv/bin/python --no-deps dist/*.whl
          .artifact-venv/bin/python -c "import forensic_data; print(forensic_data.__version__)"
          .artifact-venv/bin/python -c "from forensic_data.mssql_resources import load_mssql_2016_canonical_utf8_helper_sql; load_mssql_2016_canonical_utf8_helper_sql()"
          .artifact-venv/bin/python -c "from importlib.resources import files; root = files('forensic_data.persistence'); assert root.joinpath('sql/migrations/0001_initial.sql').read_bytes(); assert root.joinpath('sql/migrations/0002_run_lifecycle.sql').read_bytes(); assert root.joinpath('sql/migrations/0003_completed_comparisons.sql').read_bytes(); assert root.joinpath('sql/migrations/0004_retained_anomalies.sql').read_bytes(); assert root.joinpath('sql/migrations/0005_frozen_physical_union.sql').read_bytes(); assert root.joinpath('sql/bootstrap.sql').read_bytes()"
          .artifact-venv/bin/forensics --help
          .artifact-venv/bin/forensics plan --config examples/postgres-relation-manifest/contract.yaml --check daily_orders --scope-json '{"business_date":"2026-09-23"}' --output json
      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: forensic-data-python-package
          path: dist/*
      - name: Build container image
        run: docker build --platform linux/amd64 --tag forensic-data:ci .
      - name: Verify container export and import
        run: |
          docker image save forensic-data:ci --output /tmp/forensic-data-ci.tar
          docker image rm forensic-data:ci
          docker image load --input /tmp/forensic-data-ci.tar
          docker run --rm forensic-data:ci
          docker run --rm --entrypoint /app/.venv/bin/python forensic-data:ci -c "from forensic_data.mssql_resources import load_mssql_2016_canonical_utf8_helper_sql; load_mssql_2016_canonical_utf8_helper_sql()"
          test "$(docker run --rm --entrypoint id forensic-data:ci -u)" = "10001"
      - name: Start legacy box fixtures
        run: |
          docker compose --file tests/fixtures/postgres/compose.yaml up --detach --wait
          docker compose --file tests/fixtures/postgres-legacy/compose.yaml up --detach --wait
      - name: Migrate legacy box metadata
        run: >-
          docker run --rm --network host
          --env DFE_TEST_POSTGRES_METADATA_MIGRATOR_DSN
          forensic-data:ci metadata migrate
          --secret-ref env:DFE_TEST_POSTGRES_METADATA_MIGRATOR_DSN
          --statement-timeout-milliseconds 30000
          --lock-timeout-milliseconds 5000
      - name: Run PostgreSQL 9.6.24 to 17.11 box check
        run: >-
          docker run --rm --network host
          --env DFE_TEST_POSTGRES_LEGACY_SOURCE_DSN
          --env DFE_TEST_POSTGRES_LEGACY_TARGET_DSN
          --env DFE_TEST_POSTGRES_METADATA_WRITER_DSN
          --volume "${{ github.workspace }}/tests/fixtures/postgres-legacy:/fixture:ro"
          --entrypoint python
          forensic-data:ci /fixture/box_check.py
      - name: Stop legacy box fixtures
        if: always()
        run: |
          docker compose --file tests/fixtures/postgres-legacy/compose.yaml down --volumes
          docker compose --file tests/fixtures/postgres/compose.yaml down --volumes
      - name: Run Docker quickstart and persistence smoke
        env:
          DFE_IMAGE: forensic-data:ci
        run: |
          mkdir -p .local/docker-quickstart
          DFE_HOST_UID="$(id -u)" DFE_HOST_GID="$(id -g)" \
            docker compose --file examples/docker-quickstart/secrets.compose.yaml run --rm generate
          docker compose --file examples/docker-quickstart/secrets.compose.yaml down
          docker compose --profile demo up --detach --wait metadata demo-postgres
          docker compose run --rm metadata-init
          docker compose run --rm metadata-migrate
          docker compose run --rm demo-check
          docker compose run --rm demo-history
          docker compose run --rm demo-diff
          mkdir -p /tmp/forensic-data-quickstart-baseline
          cp .local/docker-quickstart/output/check.json /tmp/forensic-data-quickstart-baseline/check.json
          cp .local/docker-quickstart/output/history.json /tmp/forensic-data-quickstart-baseline/history.json
          cp .local/docker-quickstart/output/diff.json /tmp/forensic-data-quickstart-baseline/diff.json
          docker compose run --rm --entrypoint /bin/sh demo-check -c \
            'test ! -e /run/secrets/metadata_admin_password && test ! -e /run/secrets/metadata_migrator_dsn'
          docker compose stop demo-postgres
          docker compose stop metadata
          docker compose rm --force metadata
          docker compose up --detach --wait metadata
          docker compose run --rm demo-history
          docker compose run --rm demo-diff
          cmp --silent /tmp/forensic-data-quickstart-baseline/check.json .local/docker-quickstart/output/check.json
          cmp --silent /tmp/forensic-data-quickstart-baseline/history.json .local/docker-quickstart/output/history.json
          cmp --silent /tmp/forensic-data-quickstart-baseline/diff.json .local/docker-quickstart/output/diff.json
          docker compose run --rm metadata-init
          docker compose run --rm metadata-migrate
      - name: Stop Docker quickstart
        if: always()
        env:
          DFE_IMAGE: forensic-data:ci
        run: |
          docker compose --profile setup --profile demo down --volumes --remove-orphans
          docker compose --file examples/docker-quickstart/secrets.compose.yaml down --remove-orphans
