name: ClickHouse cross-engine endpoint

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clickhouse-endpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endpoint:
    name: PostgreSQL, original Greenplum, and MSSQL to ClickHouse
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DFE_GREENGAGE_PORT: "15431"
      DFE_ORIGINAL_GREENPLUM_PORT: "15430"
      DFE_PG_ADMIN_PASSWORD: phase01-admin
      DFE_PG_READER_PASSWORD: phase01-reader
      DFE_PG_WRITER_PASSWORD: phase01-writer
      DFE_PG_METADATA_MIGRATOR_PASSWORD: phase02-metadata-migrator
      DFE_PG_METADATA_WRITER_PASSWORD: phase02-metadata-writer
      DFE_PG_METADATA_READER_PASSWORD: phase02-metadata-reader
      DFE_PG_PORT: "55432"
      DFE_TEST_POSTGRES_ADMIN_DSN: "postgresql://postgres:phase01-admin@127.0.0.1:55432/postgres?sslmode=disable&connect_timeout=5"
      DFE_TEST_POSTGRES_READER_DSN: "postgresql://dfe_fixture_reader:phase01-reader@127.0.0.1:55432/dfe_fixture?sslmode=disable&connect_timeout=5"
      DFE_TEST_POSTGRES_WRITER_DSN: "postgresql://dfe_fixture_writer:phase01-writer@127.0.0.1:55432/dfe_fixture?sslmode=disable&connect_timeout=5"
      DFE_TEST_POSTGRES_METADATA_MIGRATOR_DSN: "postgresql://dfe_metadata_migrator_login:phase02-metadata-migrator@127.0.0.1:55432/dfe_fixture?sslmode=disable&connect_timeout=5"
      DFE_TEST_POSTGRES_METADATA_WRITER_DSN: "postgresql://dfe_metadata_writer_login:phase02-metadata-writer@127.0.0.1:55432/dfe_fixture?sslmode=disable&connect_timeout=5"
      DFE_TEST_POSTGRES_METADATA_READER_DSN: "postgresql://dfe_metadata_reader_login:phase02-metadata-reader@127.0.0.1:55432/dfe_fixture?sslmode=disable&connect_timeout=5"
      DFE_MSSQL_SA_PASSWORD: Phase03-Mssql-SA-2022!
      DFE_MSSQL_READER_PASSWORD: Phase03-Mssql-Reader-2022!
      DFE_MSSQL_SETUP_WRITER_PASSWORD: Phase03-Mssql-Writer-2022!
      DFE_MSSQL_PORT: "51433"
      DFE_CLICKHOUSE_HTTP_PORT: "18123"
      DFE_CLICKHOUSE_HTTPS_PORT: "18443"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          version: "0.12.18"
      - name: Install Microsoft ODBC Driver 18.7.1.1
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/msodbcsql18_18.7.1.1-1_amd64.deb \
            https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/m/msodbcsql18/msodbcsql18_18.7.1.1-1_amd64.deb
          echo "f506cb3de8b34cd94e9014d247b39e9dfd7effad79edad3ab67096dc3c1b6b0e  /tmp/msodbcsql18_18.7.1.1-1_amd64.deb" \
            | sha256sum --check --strict
          sudo apt-get update
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends \
            /tmp/msodbcsql18_18.7.1.1-1_amd64.deb
          test "$(dpkg-query --show --showformat='${Version}' msodbcsql18)" = "18.7.1.1-1"
          rm /tmp/msodbcsql18_18.7.1.1-1_amd64.deb
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Acquire exact artifacts
        shell: bash
        run: bash tests/fixtures/greenplum/prepare-artifacts.sh
      - name: Create ephemeral integration secrets
        shell: bash
        run: |
          umask 077
          original_greenplum_reader_file="${RUNNER_TEMP}/dfe-original-greenplum-reader-password"
          original_greenplum_writer_file="${RUNNER_TEMP}/dfe-original-greenplum-writer-password"
          greengage_reader_file="${RUNNER_TEMP}/dfe-greengage-reader-password"
          greengage_writer_file="${RUNNER_TEMP}/dfe-greengage-writer-password"
          original_greenplum_reader="$(openssl rand -hex 32)"
          original_greenplum_writer="$(openssl rand -hex 32)"
          greengage_reader="$(openssl rand -hex 32)"
          greengage_writer="$(openssl rand -hex 32)"
          echo "::add-mask::${original_greenplum_reader}"
          echo "::add-mask::${original_greenplum_writer}"
          echo "::add-mask::${greengage_reader}"
          echo "::add-mask::${greengage_writer}"
          printf '%s' "${original_greenplum_reader}" > "${original_greenplum_reader_file}"
          printf '%s' "${original_greenplum_writer}" > "${original_greenplum_writer_file}"
          printf '%s' "${greengage_reader}" > "${greengage_reader_file}"
          printf '%s' "${greengage_writer}" > "${greengage_writer_file}"
          {
            echo "DFE_ORIGINAL_GREENPLUM_READER_PASSWORD_FILE=${original_greenplum_reader_file}"
            echo "DFE_ORIGINAL_GREENPLUM_WRITER_PASSWORD_FILE=${original_greenplum_writer_file}"
            echo "DFE_GREENGAGE_READER_PASSWORD_FILE=${greengage_reader_file}"
            echo "DFE_GREENGAGE_WRITER_PASSWORD_FILE=${greengage_writer_file}"
            echo "DFE_TEST_ORIGINAL_GREENPLUM_READER_DSN=postgresql://dfe_original_greenplum_reader:${original_greenplum_reader}@127.0.0.1:${DFE_ORIGINAL_GREENPLUM_PORT}/dfe_fixture?sslmode=disable&connect_timeout=5"
            echo "DFE_TEST_ORIGINAL_GREENPLUM_WRITER_DSN=postgresql://dfe_original_greenplum_writer:${original_greenplum_writer}@127.0.0.1:${DFE_ORIGINAL_GREENPLUM_PORT}/dfe_fixture?sslmode=disable&connect_timeout=5"
            echo "DFE_TEST_GREENGAGE_READER_DSN=postgresql://dfe_greengage_reader:${greengage_reader}@127.0.0.1:${DFE_GREENGAGE_PORT}/dfe_fixture?sslmode=disable&connect_timeout=5"
            echo "DFE_TEST_GREENGAGE_WRITER_DSN=postgresql://dfe_greengage_writer:${greengage_writer}@127.0.0.1:${DFE_GREENGAGE_PORT}/dfe_fixture?sslmode=disable&connect_timeout=5"
          } >> "${GITHUB_ENV}"
      - name: Create ephemeral ClickHouse fixture credentials
        run: |
          admin_password="$(openssl rand -hex 32)"
          reader_password="$(openssl rand -hex 32)"
          writer_password="$(openssl rand -hex 32)"
          echo "::add-mask::${admin_password}"
          echo "::add-mask::${reader_password}"
          echo "::add-mask::${writer_password}"
          {
            echo "DFE_CLICKHOUSE_ADMIN_PASSWORD=${admin_password}"
            echo "DFE_CLICKHOUSE_READER_PASSWORD=${reader_password}"
            echo "DFE_CLICKHOUSE_WRITER_PASSWORD=${writer_password}"
          } >> "${GITHUB_ENV}"
      - name: Build and start original Greenplum source
        shell: bash
        run: |
          compose_files=(
            --file tests/fixtures/greenplum/compose.yaml
            --file tests/fixtures/greenplum/compose.integration.yaml
          )
          docker compose "${compose_files[@]}" config --quiet
          docker compose "${compose_files[@]}" build original-greenplum
          docker compose "${compose_files[@]}" up --detach --wait original-greenplum
          docker compose "${compose_files[@]}" exec --no-TTY --user gpadmin \
            original-greenplum /usr/local/bin/dfe-original-greenplum-verify
      - name: Start PostgreSQL 17.11 fixture
        run: docker compose --file tests/fixtures/postgres/compose.yaml up --detach --wait
      - name: Start SQL Server 2022 CU27 fixture
        run: docker compose --file tests/fixtures/mssql-2022/compose.yaml up --detach --wait sqlserver
      - name: Configure and verify SQL Server 2022 CU27 fixture
        run: |
          docker compose --file tests/fixtures/mssql-2022/compose.yaml run --rm setup-admin
          docker compose --file tests/fixtures/mssql-2022/compose.yaml run --rm setup-writer
          docker compose --file tests/fixtures/mssql-2022/compose.yaml run --rm verify
      - name: Start ClickHouse 26.8.6.5 fixture
        run: |
          docker compose --file tests/fixtures/clickhouse/compose.yaml config --quiet
          docker compose --file tests/fixtures/clickhouse/compose.yaml up --detach --wait
      - name: Run the cross-engine durability and retained-evidence gate
        id: endpoint-gate
        run: >-
          uv run pytest -q --tb=short --show-capture=no
          tests/test_clickhouse_endpoint_integration.py::test_postgres_original_greenplum_and_mssql_to_clickhouse_are_durable
      - name: Record tested revision and fixture images
        if: always()
        shell: bash
        env:
          ENDPOINT_GATE_OUTCOME: ${{ steps.endpoint-gate.outcome }}
        run: |
          {
            printf 'Tested revision: %s\n' "$(git rev-parse HEAD)"
            printf 'Scenario: test_postgres_original_greenplum_and_mssql_to_clickhouse_are_durable\n'
            printf 'Gate outcome: %s\n' "${ENDPOINT_GATE_OUTCOME}"
            docker ps --all --filter name=forensic-data- --format '{{.Names}} {{.Image}} {{.Status}}'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Remove ClickHouse containers and network
        if: always()
        run: docker compose --file tests/fixtures/clickhouse/compose.yaml down --remove-orphans
      - name: Remove disposable SQL Server fixture
        if: always()
        run: docker compose --file tests/fixtures/mssql-2022/compose.yaml down --volumes --remove-orphans
      - name: Remove PostgreSQL containers and network
        if: always()
        run: docker compose --file tests/fixtures/postgres/compose.yaml down --remove-orphans
      - name: Remove original Greenplum containers and network
        if: always()
        run: >-
          docker compose
          --file tests/fixtures/greenplum/compose.yaml
          --file tests/fixtures/greenplum/compose.integration.yaml
          down --remove-orphans
      - name: Remove ephemeral password files
        if: always()
        run: |
          rm -f -- \
            "${RUNNER_TEMP}/dfe-greengage-reader-password" \
            "${RUNNER_TEMP}/dfe-greengage-writer-password" \
            "${RUNNER_TEMP}/dfe-original-greenplum-reader-password" \
            "${RUNNER_TEMP}/dfe-original-greenplum-writer-password"
