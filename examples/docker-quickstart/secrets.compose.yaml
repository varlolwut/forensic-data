name: forensic-data-secret-setup

services:
  generate:
    image: postgres:17.11-bookworm@sha256:91eb910c44c7ed13f7f1a4ccadaa9ca72ef14cddc04cacb6e070e48eb44731a3
    platform: linux/amd64
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    network_mode: none
    environment:
      DFE_HOST_UID: ${DFE_HOST_UID:-10001}
      DFE_HOST_GID: ${DFE_HOST_GID:-10001}
    volumes:
      - ../../.local/docker-quickstart:/state
      - ./generate-secrets.sh:/opt/forensic-data/generate-secrets.sh:ro
    entrypoint: ["/bin/bash", "/opt/forensic-data/generate-secrets.sh"]
    restart: "no"
